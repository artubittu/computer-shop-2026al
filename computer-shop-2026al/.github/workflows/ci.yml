name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shop_user
          POSTGRES_PASSWORD: shop_password
          POSTGRES_DB: computer_shop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U shop_user -d computer_shop_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://shop_user:shop_password@localhost:5432/computer_shop_test?schema=public
      BETTER_AUTH_SECRET: ci-test-secret-ci-test-secret-123456
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: computer-shop-2026al/package-lock.json

      - name: Install dependencies
        working-directory: computer-shop-2026al
        run: npm ci

      - name: Generate Prisma Client
        working-directory: computer-shop-2026al
        run: npx --no-install prisma generate

      - name: Apply database migrations
        working-directory: computer-shop-2026al
        run: npx --no-install prisma migrate deploy

      - name: Run lint
        working-directory: computer-shop-2026al
        run: npm run lint

      - name: Run tests
        working-directory: computer-shop-2026al
        run: npm run test

      - name: Build application
        working-directory: computer-shop-2026al
        run: npm run build