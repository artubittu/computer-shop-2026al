services:
  postgres:
    image: postgres:17
    container_name: computer-shop-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: computer_shop
      POSTGRES_USER: shop_user
      POSTGRES_PASSWORD: shop_password

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_user -d computer_shop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: